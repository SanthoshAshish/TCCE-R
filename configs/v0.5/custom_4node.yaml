# v0.5 demo configuration for the seed-generated network (40-node random geometric graph).
# Identical to configs/v0.4/selected_d2.yaml: the settings selected by the v0.4 tuning for
# reconfiguration delay 2 (TCCE-R weights w_E=1, w_C=0, w_V=0, kappa=0.30; reactive threshold 0.3777),
# with bursty failures, strict edge budget and all v0.4 correctness fixes on.
# Use it for live demos instead of configs/v0.4/main.yaml, which keeps the untuned v0.1 debt weights.

n_nodes: 40
init_radius: 0.22
radio_range: 0.32
epochs: 80
rounds_per_epoch: 60
eps: 0.01
# p_transient: 0.05
# p_fail: 0.005
# p_repair: 0.1
w_E: 1.0
w_C: 0.0
w_V: 0.0
kappa: 0.3
vol_window: 3
theta0: 1.0
theta_min: 0.25
theta_max: 4.0
alpha: 0.25
beta: 0.1
trigger_cooldown: 2
feedback_horizon: 3
shortlist: 10
gain_tolerance: 0.1
lambda2_min: 0.05
d_max: 10
# edge_budget_frac: 1.0
edge_cooldown: 5
# budget_on: configured
# link_setup_epochs: 2
degree_fix: true
degree_basis: configured
feedback_after_setup: true
failed_link_value: if_up
burst_rate: 0.1
burst_radius: 0.15
burst_min_len: 2
burst_max_len: 6
reactive_threshold: 0.3777
period: 5
mutation_cap: null

scenario_file: ../../examples/custom_4node.yaml

epochs: 15
rounds_per_epoch: 60

p_transient: 0.0
p_fail: 0.0
p_repair: 0.0
burst_rate: 0.0

edge_budget_frac: 1.0
budget_on: configured
link_setup_epochs: 1
